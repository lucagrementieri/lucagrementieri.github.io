<li class="nav-icon">
  <button type="button" class="theme-toggle" aria-label="{{ i18n "themeAuto" }}" title="{{ i18n "themeAuto" }}"
    data-label-auto="{{ i18n "themeAuto" }}" data-label-light="{{ i18n "themeLight" }}" data-label-dark="{{ i18n "themeDark" }}">
    {{- /* Half-filled circle: follow the system. */}}
    <svg class="theme-icon theme-icon-auto" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
    </svg>
    {{- /* Sun: light. */}}
    <svg class="theme-icon theme-icon-light" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
      <g stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <path d="M12 1.5v2.5M12 20v2.5M1.5 12h2.5M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/>
      </g>
    </svg>
    {{- /* Moon: dark. */}}
    <svg class="theme-icon theme-icon-dark" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z" fill="currentColor"/>
    </svg>
  </button>
</li>
